AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Iiwake Colosseum MVP API

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 35
    MemorySize: 512
    Environment:
      Variables:
        AI_PROVIDER: bedrock
        STORAGE_PROVIDER: dynamodb
        GAME_SESSIONS_TABLE: !Ref GameSessionsTable
        PLAY_LOG_TTL_DAYS: "30"
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_TEMPERATURE: "0.8"
        BEDROCK_MAX_TOKENS: "1200"

Parameters:
  BedrockModelId:
    Type: String
    Default: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID used for scenario, judge, and final judgement generation.
  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Browser origin allowed to call the HTTP API.

Resources:
  DemoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  DemoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web-client"
      UserPoolId: !Ref DemoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  GameApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${DemoUserPool}"
              audience:
                - !Ref DemoUserPoolClient
            IdentitySource: "$request.header.Authorization"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowMethods:
          - POST
          - GET
        AllowHeaders:
          - content-type
          - authorization
        AllowOrigins:
          - !Ref FrontendOrigin

  GameSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  StartGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src/lambda/handlers.startGameHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        StartGame:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /api/game/start
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambda/handlers.ts

  SubmitExcuseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src/lambda/handlers.submitExcuseHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        SubmitExcuse:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /api/game/submit
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambda/handlers.ts

  GetGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src/lambda/handlers.getGameHandler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionsTable
      Events:
        GetGame:
          Type: HttpApi
          Properties:
            ApiId: !Ref GameApi
            Path: /api/game/{sessionId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/lambda/handlers.ts

  StartGameFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StartGameFunction}"
      RetentionInDays: 7

  SubmitExcuseFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SubmitExcuseFunction}"
      RetentionInDays: 7

  GetGameFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetGameFunction}"
      RetentionInDays: 7

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub "https://${GameApi}.execute-api.${AWS::Region}.amazonaws.com"
  CognitoUserPoolId:
    Description: Cognito user pool ID for demo users
    Value: !Ref DemoUserPool
  CognitoUserPoolClientId:
    Description: Cognito app client ID used by the web app
    Value: !Ref DemoUserPoolClient
  AwsRegion:
    Description: AWS region for frontend configuration
    Value: !Ref AWS::Region
